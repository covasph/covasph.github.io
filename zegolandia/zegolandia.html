<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zegolandia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🧱 Zegolandia</h1>
        
        <!-- Botão de debug - escondido mas acessível -->
        <button id="debug-toggle" style="display: none; padding: 10px 20px; background: #333; color: white; border: none; border-radius: 5px; cursor: pointer; position: fixed; bottom: 20px; right: 20px; z-index: 1000;" onclick="toggleDebug()">
            🔍 Debug
        </button>
        
        <!-- Área de debug -->
        <div id="debug-area" style="display: none; background: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 8px; margin-bottom: 20px; max-height: 400px; overflow: auto; font-family: 'Courier New', monospace; font-size: 12px;">
            <div id="debug-content">🔧 A aguardar ações...</div>
        </div>
        
        <div id="cards-container" class="cards-grid">
            <!-- Os cards serão gerados aqui pelo JavaScript -->
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
