<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamebook - Aventura Interativa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #0f0f1a;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .imagem-container {
            width: 100%;
            height: 300px;
            background: #2d2d3a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .imagem-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .conteudo {
            padding: 30px;
        }
        .titulo {
            color: #ffd700;
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-left: 4px solid #ffd700;
            padding-left: 15px;
        }
        .texto {
            color: #e0e0e0;
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .opcoes {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            background: #2d2d3a;
            color: #ffd700;
            border: 1px solid #ffd700;
            padding: 14px 20px;
            font-size: 1rem;
            font-family: inherit;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        button:hover {
            background: #ffd700;
            color: #0f0f1a;
            transform: translateX(5px);
        }
        .reset {
            margin-top: 20px;
            background: transparent;
            border-color: #666;
            color: #999;
            text-align: center;
        }
        .reset:hover {
            background: #666;
            color: white;
            transform: none;
        }
        .loading {
            text-align: center;
            color: #ffd700;
            padding: 50px;
            font-size: 1.2rem;
        }
        .erro {
            text-align: center;
            color: #ff6666;
            padding: 50px;
        }
        @media (max-width: 600px) {
            .conteudo { padding: 20px; }
            .texto { font-size: 1rem; }
            .imagem-container { height: 200px; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="loading">
            ⚙️ A carregar a tua aventura...
        </div>
    </div>

    <script>
        // Variáveis globais
        let historia = null;
        let secaoAtual = null;

        // Aguardar o DOM carregar
        document.addEventListener('DOMContentLoaded', () => {
            carregarHistoria();
        });

        async function carregarHistoria() {
            try {
                // Buscar o ficheiro JSON
                const resposta = await fetch('dados/historia.json');
                
                if (!resposta.ok) {
                    throw new Error(`HTTP ${resposta.status}: ${resposta.statusText}`);
                }
                
                historia = await resposta.json();
                
                // Verificar se tem a secção "inicio"
                if (!historia['inicio']) {
                    throw new Error('O JSON deve ter uma secção chamada "inicio"');
                }
                
                // Renderizar a história
                renderizarApp();
                carregarSecao('inicio');
                
            } catch (erro) {
                console.error('Erro ao carregar história:', erro);
                mostrarErro(`Não foi possível carregar a história: ${erro.message}`);
            }
        }

        function renderizarApp() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="imagem-container" id="imagem-container">
                    <img id="imagem-principal" src="" alt="Ilustração da cena">
                </div>
                <div class="conteudo">
                    <div class="titulo" id="titulo"></div>
                    <div class="texto" id="texto"></div>
                    <div class="opcoes" id="opcoes"></div>
                    <button class="reset" id="reset-btn">↺ Recomeçar</button>
                </div>
            `;
            
            // Atribuir evento ao botão reset
            document.getElementById('reset-btn').addEventListener('click', () => {
                carregarSecao('inicio');
            });
        }

        function carregarSecao(secaoId) {
            if (!historia) {
                console.error('História não carregada');
                return;
            }
            
            const secao = historia[secaoId];
            if (!secao) {
                console.error(`Secção "${secaoId}" não encontrada`);
                carregarSecao('inicio');
                return;
            }
            
            secaoAtual = secaoId;
            
            // Atualizar título
            const tituloEl = document.getElementById('titulo');
            if (tituloEl) tituloEl.textContent = secao.titulo || '';
            
            // Atualizar texto
            const textoEl = document.getElementById('texto');
            if (textoEl) textoEl.innerHTML = secao.texto;
            
            // Atualizar imagem
            const imgEl = document.getElementById('imagem-principal');
            if (imgEl) {
                if (secao.imagem) {
                    imgEl.src = secao.imagem;
                    imgEl.alt = secao.titulo || 'Ilustração';
                } else {
                    imgEl.src = 'https://picsum.photos/id/20/800/400';
                }
            }
            
            // Atualizar botões de opção
            const opcoesDiv = document.getElementById('opcoes');
            if (opcoesDiv) {
                opcoesDiv.innerHTML = '';
                
                if (secao.opcoes && secao.opcoes.length > 0) {
                    secao.opcoes.forEach(opcao => {
                        const btn = document.createElement('button');
                        btn.textContent = opcao.descricao;
                        btn.addEventListener('click', () => carregarSecao(opcao.destino));
                        opcoesDiv.appendChild(btn);
                    });
                } else {
                    const fimMsg = document.createElement('p');
                    fimMsg.style.color = '#ffd700';
                    fimMsg.style.fontStyle = 'italic';
                    fimMsg.style.textAlign = 'center';
                    fimMsg.style.marginTop = '20px';
                    fimMsg.textContent = '✨ FIM DA HISTÓRIA ✨';
                    opcoesDiv.appendChild(fimMsg);
                }
            }
        }

        function mostrarErro(mensagem) {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="erro">
                    ❌ ${mensagem}<br><br>
                    <button onclick="location.reload()">🔁 Tentar novamente</button>
                </div>
            `;
        }
    </script>
</body>
</html>
