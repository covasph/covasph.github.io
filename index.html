<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Antioch · Biblioteca Elsa, Vasco e Hugo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #eef2f7 0%, #e0e8f0 100%);
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            color: #1a2c3c;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1f4e6e, #0e3a52, #2c6c8f);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 500;
            color: #3e6b8c;
            margin-top: 0.2rem;
            font-style: italic;
        }

        .stats-btn-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .stats-button, .reload-button {
            background: #2c5a7a;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #f0f7fc;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .reload-button {
            background: #5a6e7a;
        }

        .search-section {
            background: #ffffffdd;
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 6px 14px rgba(0, 20, 40, 0.08);
            border: 1px solid #cbdde9;
        }

        .search-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 3;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 1px solid #bdd4e2;
            border-radius: 3rem;
            font-size: 1rem;
            background: #ffffff;
            outline: none;
        }

        .search-box input:focus {
            border-color: #3e8ab3;
            box-shadow: 0 0 0 3px rgba(62, 138, 179, 0.2);
        }

        .filter-group {
            flex: 2;
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .filter-group select {
            flex: 1;
            padding: 0.9rem 1rem;
            border-radius: 3rem;
            border: 1px solid #bdd4e2;
            background: white;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .clear-btn {
            background: #e3edf5;
            border: none;
            padding: 0 1.4rem;
            border-radius: 3rem;
            font-weight: 600;
            cursor: pointer;
        }

        .result-count {
            margin: 0.8rem 0 1rem 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #437693;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.8rem;
        }

        .book-card {
            background: #ffffff;
            border-radius: 1.2rem;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s;
            box-shadow: 0 6px 14px rgba(33, 58, 78, 0.06);
            border: 1px solid #d6e2ec;
            display: flex;
            flex-direction: row;
            height: 180px;
        }

        .book-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px -8px rgba(28, 75, 105, 0.2);
        }

        /* Capa do livro */
        .book-cover {
            width: 120px;
            min-width: 120px;
            background: #f0f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-right: 1px solid #e0e8f0;
        }

        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cover-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #d4e0e8, #e8f0f5);
            color: #5f8aac;
            font-size: 2rem;
        }

        .card-content {
            padding: 1rem 1.2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .book-title {
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 0.3rem;
            color: #1f405b;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-author {
            font-size: 0.75rem;
            font-weight: 600;
            color: #2f6c8a;
            margin-bottom: 0.4rem;
        }

        .book-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            font-size: 0.65rem;
            margin: 0.4rem 0;
            color: #5f7e96;
        }

        .editora-badge, .colecao-tag {
            background: #eaf1f7;
            padding: 0.15rem 0.5rem;
            border-radius: 20px;
        }

        .colecao-tag {
            background: #d9e6f0;
            color: #1f5777;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin: 0.4rem 0;
        }

        .tag {
            background: #eef3f8;
            padding: 0.1rem 0.5rem;
            border-radius: 15px;
            font-size: 0.6rem;
            font-weight: 500;
            color: #2c6482;
        }

        .sinopse {
            font-size: 0.7rem;
            color: #2e546e;
            line-height: 1.3;
            margin-top: 0.4rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .isbn {
            font-size: 0.6rem;
            font-family: monospace;
            color: #7b98ae;
            margin-top: 0.3rem;
        }

        .no-results, .error-message {
            text-align: center;
            padding: 3rem;
            background: #f9fdfe;
            border-radius: 2rem;
            color: #5682a0;
        }

        .error-message {
            background: #fff0f0;
            color: #c7254e;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(18, 45, 65, 0.8);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-container {
            background: #fefefe;
            width: 90%;
            max-width: 780px;
            max-height: 85vh;
            border-radius: 2rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 1.2rem 1.5rem;
            background: #e5f0f7;
            border-bottom: 1px solid #c9deec;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.4rem;
            color: #1b4f6e;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #4c7b9b;
        }

        .modal-body {
            padding: 1.2rem 1.5rem;
            overflow-y: auto;
            flex: 1;
        }

        .stats-section {
            margin-bottom: 1.5rem;
        }

        .stats-section h3 {
            font-size: 1.1rem;
            border-left: 4px solid #5f9bc2;
            padding-left: 0.6rem;
            margin-bottom: 0.8rem;
            color: #1e5779;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.6rem;
            background: #f6fafd;
            padding: 0.8rem;
            border-radius: 1rem;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 0.3rem 0;
            border-bottom: 1px dashed #cde0ec;
            font-size: 0.8rem;
        }

        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag-stat {
            background: #e6f0f7;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.75rem;
        }

        @media (max-width: 640px) {
            .books-grid {
                grid-template-columns: 1fr;
            }
            .book-card {
                height: 160px;
            }
            .book-cover {
                width: 100px;
                min-width: 100px;
            }
            .book-title {
                font-size: 0.9rem;
            }
            .stats-btn-wrapper {
                justify-content: center;
            }
            .search-wrapper, .filter-group {
                flex-direction: column;
            }
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #7c9bb3;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🏛️ Antioch</h1>
        <div class="subtitle">Biblioteca Elsa, Vasco e Hugo</div>
        <div class="stats-btn-wrapper">
            <button id="openStatsModal" class="stats-button">📊 Estatísticas</button>
            <button id="reloadCoversBtn" class="reload-button">🖼️ Recarregar Capas</button>
        </div>
    </div>

    <div class="search-section">
        <div class="search-wrapper">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Pesquisar título, autor, sinopse ou tag..." autocomplete="off">
            </div>
            <div class="filter-group">
                <select id="authorFilter"><option value="">Todos os autores</option></select>
                <select id="collectionFilter"><option value="">Todas as coleções</option></select>
                <button id="clearFilters" class="clear-btn">Limpar ✕</button>
            </div>
        </div>
        <div class="result-count" id="resultCount"></div>
    </div>

    <div id="booksContainer" class="books-grid">
        <div class="no-results">📖 A carregar biblioteca...</div>
    </div>
    <footer>✨ Antioch · capas obtidas via Open Library e Google Books</footer>
</div>

<div id="statsModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h2>📊 Estatísticas</h2>
            <button class="close-modal" id="closeModalBtn">&times;</button>
        </div>
        <div class="modal-body" id="statsModalBody">Carregando...</div>
    </div>
</div>

<script>
    let bibliotecaData = { livros: [] };
    let livrosFiltrados = [];
    let coverCache = new Map(); // Cache das URLs das capas

    // Elementos
    const searchInput = document.getElementById('searchInput');
    const authorFilter = document.getElementById('authorFilter');
    const collectionFilter = document.getElementById('collectionFilter');
    const clearBtn = document.getElementById('clearFilters');
    const booksContainer = document.getElementById('booksContainer');
    const resultCountSpan = document.getElementById('resultCount');
    const reloadCoversBtn = document.getElementById('reloadCoversBtn');
    
    // Modal
    const modal = document.getElementById('statsModal');
    const openStatsBtn = document.getElementById('openStatsModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const statsModalBody = document.getElementById('statsModalBody');

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function getAutorString(autor) {
        if (!autor) return "Autor desconhecido";
        if (typeof autor === 'string') return autor;
        if (Array.isArray(autor)) return autor.join(' e ');
        return String(autor);
    }

    function getAutorArray(autor) {
        if (!autor) return [];
        if (typeof autor === 'string') return [autor];
        if (Array.isArray(autor)) return autor;
        return [String(autor)];
    }

    function getColecaoNome(livro) {
        if (livro.colecao === true && livro.nome_colecao) return livro.nome_colecao;
        return null;
    }

    // ========== FUNÇÕES PARA OBTER CAPAS ==========
    
    // Tenta obter capa via Open Library (mais simples)
    function getOpenLibraryCover(isbn) {
        if (!isbn) return null;
        return `https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg`;
    }
    
    // Tenta obter capa via Google Books (fallback)
    async function getGoogleBooksCover(isbn, titulo, autor) {
        return new Promise((resolve) => {
            let query = '';
            if (isbn) {
                query = `isbn:${isbn}`;
            } else {
                query = encodeURIComponent(`${titulo} ${getAutorString(autor)}`);
            }
            
            const url = `https://www.googleapis.com/books/v1/volumes?q=${query}&maxResults=1`;
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.items && data.items[0] && data.items[0].volumeInfo.imageLinks) {
                        const coverUrl = data.items[0].volumeInfo.imageLinks.thumbnail;
                        resolve(coverUrl ? coverUrl.replace('&edge=curl', '') : null);
                    } else {
                        resolve(null);
                    }
                })
                .catch(() => resolve(null));
        });
    }
    
    // Função principal para obter URL da capa (com cache)
    async function getBookCoverUrl(livro) {
        const isbn = livro.isbn;
        const titulo = livro.titulo || '';
        const autor = livro.autor;
        
        // Verificar cache
        const cacheKey = isbn || `${titulo}_${getAutorString(autor)}`;
        if (coverCache.has(cacheKey)) {
            return coverCache.get(cacheKey);
        }
        
        // Tentar Open Library (mais rápido)
        if (isbn) {
            const openLibraryUrl = getOpenLibraryCover(isbn);
            // Verificar se a imagem existe (teste rápido)
            try {
                const testResponse = await fetch(openLibraryUrl, { method: 'HEAD' });
                if (testResponse.ok) {
                    coverCache.set(cacheKey, openLibraryUrl);
                    return openLibraryUrl;
                }
            } catch(e) {
                // Falhou, tentar Google Books
            }
        }
        
        // Fallback: Google Books
        const googleUrl = await getGoogleBooksCover(isbn, titulo, autor);
        if (googleUrl) {
            coverCache.set(cacheKey, googleUrl);
            return googleUrl;
        }
        
        // Sem capa encontrada
        coverCache.set(cacheKey, null);
        return null;
    }
    
    // Renderizar livros COM capas (carregamento assíncrono)
    function renderizarLivros(livrosArray) {
        if (!livrosArray || livrosArray.length === 0) {
            booksContainer.innerHTML = '<div class="no-results">📭 Nenhum livro encontrado.</div>';
            return;
        }
        
        // Gerar HTML base com placeholders
        let html = '';
        for (var i = 0; i < livrosArray.length; i++) {
            var livro = livrosArray[i];
            
            var titulo = livro.titulo || "Título desconhecido";
            var autorString = getAutorString(livro.autor);
            var editora = livro.editora || "";
            var sinopseText = livro.sinopse || "Sem sinopse disponível.";
            var shortSinopse = sinopseText.length > 100 ? sinopseText.substring(0, 100) + '…' : sinopseText;
            var isbn = livro.isbn || "";
            
            // Tags
            var tagsHtml = '';
            if (livro.tags && Array.isArray(livro.tags) && livro.tags.length > 0) {
                var tagItems = '';
                for (var t = 0; t < Math.min(3, livro.tags.length); t++) {
                    tagItems += '<span class="tag">#' + escapeHtml(livro.tags[t]) + '</span>';
                }
                if (livro.tags.length > 3) {
                    tagItems += '<span class="tag">+'+ (livro.tags.length - 3) +'</span>';
                }
                tagsHtml = '<div class="tag-list">' + tagItems + '</div>';
            }
            
            // Coleção
            var colecaoHtml = '';
            if (livro.colecao === true && livro.nome_colecao) {
                var volInfo = livro.volume_colecao ? ' Vol.' + livro.volume_colecao : '';
                colecaoHtml = '<span class="colecao-tag">📘 ' + escapeHtml(livro.nome_colecao) + volInfo + '</span>';
            }
            
            var editoraHtml = editora ? '<span class="editora-badge">🏢 ' + escapeHtml(editora) + '</span>' : '';
            
            // ID único para atualizar a capa depois
            var cardId = 'card_' + i + '_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            
            html += '<div class="book-card" id="' + cardId + '">' +
                        '<div class="book-cover" id="cover_' + cardId + '">' +
                            '<div class="cover-placeholder">📚</div>' +
                        '</div>' +
                        '<div class="card-content">' +
                            '<div class="book-title">' + escapeHtml(titulo) + '</div>' +
                            '<div class="book-author">✍️ ' + escapeHtml(autorString) + '</div>' +
                            '<div class="book-meta">' + editoraHtml + ' ' + colecaoHtml + '</div>' +
                            tagsHtml +
                            '<div class="sinopse">📖 ' + escapeHtml(shortSinopse) + '</div>' +
                            (isbn ? '<div class="isbn">ISBN: ' + isbn + '</div>' : '') +
                        '</div>' +
                    '</div>';
            
            // Carregar capa assincronamente
            (function(id, livroLocal, idx) {
                getBookCoverUrl(livroLocal).then(coverUrl => {
                    var coverDiv = document.getElementById('cover_' + id);
                    if (coverDiv && coverUrl) {
                        coverDiv.innerHTML = '<img src="' + coverUrl + '" alt="Capa" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=\\\'cover-placeholder\\\'>📚</div>\'">';
                    }
                }).catch(() => {});
            })(cardId, livro, i);
        }
        
        booksContainer.innerHTML = html;
    }

    function aplicarFiltros() {
        var termo = searchInput.value.trim().toLowerCase();
        var autorSel = authorFilter.value;
        var colecaoSel = collectionFilter.value;
        
        var filtrados = [];
        for (var i = 0; i < bibliotecaData.livros.length; i++) {
            var livro = bibliotecaData.livros[i];
            
            var matchTexto = true;
            if (termo !== "") {
                var tituloMatch = (livro.titulo || "").toLowerCase().indexOf(termo) !== -1;
                var autoresLivro = getAutorArray(livro.autor);
                var autorMatch = false;
                for (var a = 0; a < autoresLivro.length; a++) {
                    if ((autoresLivro[a] || "").toLowerCase().indexOf(termo) !== -1) {
                        autorMatch = true;
                        break;
                    }
                }
                var sinopseMatch = (livro.sinopse || "").toLowerCase().indexOf(termo) !== -1;
                var tagsMatch = false;
                if (livro.tags && Array.isArray(livro.tags)) {
                    for (var t = 0; t < livro.tags.length; t++) {
                        if ((livro.tags[t] || "").toLowerCase().indexOf(termo) !== -1) {
                            tagsMatch = true;
                            break;
                        }
                    }
                }
                matchTexto = tituloMatch || autorMatch || sinopseMatch || tagsMatch;
            }
            
            var matchAutor = true;
            if (autorSel !== "") {
                var autoresLivro = getAutorArray(livro.autor);
                matchAutor = false;
                for (var a = 0; a < autoresLivro.length; a++) {
                    if (autoresLivro[a] === autorSel) {
                        matchAutor = true;
                        break;
                    }
                }
            }
            
            var matchColecao = true;
            if (colecaoSel !== "") {
                var collNome = getColecaoNome(livro);
                matchColecao = (collNome === colecaoSel);
            }
            
            if (matchTexto && matchAutor && matchColecao) {
                filtrados.push(livro);
            }
        }
        
        livrosFiltrados = filtrados;
        resultCountSpan.textContent = "📌 " + livrosFiltrados.length + " de " + bibliotecaData.livros.length + " livro(s)";
        renderizarLivros(livrosFiltrados);
    }

    function atualizarFiltrosOptions() {
        const autores = new Set();
        const colecoes = new Set();
        
        for (var i = 0; i < bibliotecaData.livros.length; i++) {
            var livro = bibliotecaData.livros[i];
            var autoresLivro = getAutorArray(livro.autor);
            for (var a = 0; a < autoresLivro.length; a++) {
                var nomeAutor = autoresLivro[a];
                if (nomeAutor && typeof nomeAutor === 'string' && nomeAutor.trim() !== '') {
                    autores.add(nomeAutor.trim());
                }
            }
            var coll = getColecaoNome(livro);
            if (coll) colecoes.add(coll);
        }
        
        authorFilter.innerHTML = '<option value="">Todos os autores</option>';
        var autoresArray = Array.from(autores);
        autoresArray.sort();
        for (var i = 0; i < autoresArray.length; i++) {
            authorFilter.innerHTML += '<option value="' + escapeHtml(autoresArray[i]) + '">' + escapeHtml(autoresArray[i]) + '</option>';
        }
        
        collectionFilter.innerHTML = '<option value="">Todas as coleções</option>';
        var colecoesArray = Array.from(colecoes);
        colecoesArray.sort();
        for (var i = 0; i < colecoesArray.length; i++) {
            collectionFilter.innerHTML += '<option value="' + escapeHtml(colecoesArray[i]) + '">' + escapeHtml(colecoesArray[i]) + '</option>';
        }
    }

    function gerarEstatisticas() {
        var livros = bibliotecaData.livros;
        if (!livros.length) return "<div>Nenhum livro carregado.</div>";
        
        var autorCount = new Map();
        var tagCount = new Map();
        var colecaoCount = new Map();
        
        for (var i = 0; i < livros.length; i++) {
            var livro = livros[i];
            var autoresLivro = getAutorArray(livro.autor);
            for (var a = 0; a < autoresLivro.length; a++) {
                var autor = autoresLivro[a] || "Desconhecido";
                autorCount.set(autor, (autorCount.get(autor) || 0) + 1);
            }
            if (livro.tags && Array.isArray(livro.tags)) {
                for (var t = 0; t < livro.tags.length; t++) {
                    var tag = (livro.tags[t] || "").toLowerCase();
                    if (tag) tagCount.set(tag, (tagCount.get(tag) || 0) + 1);
                }
            }
            var coll = getColecaoNome(livro);
            if (coll) colecaoCount.set(coll, (colecaoCount.get(coll) || 0) + 1);
        }
        
        var topAutores = Array.from(autorCount.entries());
        topAutores.sort(function(a, b) { return b[1] - a[1]; });
        topAutores = topAutores.slice(0, 15);
        
        var topTags = Array.from(tagCount.entries());
        topTags.sort(function(a, b) { return b[1] - a[1]; });
        topTags = topTags.slice(0, 15);
        
        var topColecoes = Array.from(colecaoCount.entries());
        topColecoes.sort(function(a, b) { return b[1] - a[1]; });
        
        var html = '<div class="stats-section"><h3>📚 Resumo</h3><div class="stats-grid">' +
                    '<div class="stat-item"><strong>Total livros</strong> <span>' + livros.length + '</span></div>' +
                    '<div class="stat-item"><strong>Autores</strong> <span>' + autorCount.size + '</span></div>' +
                    '<div class="stat-item"><strong>Coleções</strong> <span>' + colecaoCount.size + '</span></div>' +
                    '</div></div>' +
                    '<div class="stats-section"><h3>✍️ Autores</h3><div class="stats-grid">';
        for (var i = 0; i < topAutores.length; i++) {
            html += '<div class="stat-item">' + escapeHtml(topAutores[i][0]) + ' <span>' + topAutores[i][1] + '</span></div>';
        }
        html += '</div></div><div class="stats-section"><h3>🏷️ Tags</h3><div class="tag-cloud">';
        for (var i = 0; i < topTags.length; i++) {
            html += '<span class="tag-stat">#' + escapeHtml(topTags[i][0]) + ' (' + topTags[i][1] + ')</span>';
        }
        html += '</div></div><div class="stats-section"><h3>📖 Coleções</h3><div class="stats-grid">';
        for (var i = 0; i < topColecoes.length; i++) {
            html += '<div class="stat-item">' + escapeHtml(topColecoes[i][0]) + ' <span>' + topColecoes[i][1] + ' vol.</span></div>';
        }
        html += '</div></div>';
        return html;
    }

    async function carregarDados() {
        booksContainer.innerHTML = '<div class="no-results">📖 A carregar biblioteca...</div>';
        
        try {
            var response = await fetch('book_db.json?t=' + Date.now());
            if (response.ok) {
                var data = await response.json();
                if (data && data.livros && Array.isArray(data.livros)) {
                    bibliotecaData = data;
                    console.log("✅ Carregados " + bibliotecaData.livros.length + " livros");
                }
            } else {
                console.warn("Ficheiro não encontrado");
            }
        } catch (e) {
            console.warn("Erro no fetch:", e.message);
        }
        
        if (bibliotecaData.livros.length === 0) {
            booksContainer.innerHTML = '<div class="error-message">⚠️ Não foi possível carregar os livros.</div>';
            return;
        }
        
        // Limpar cache de capas ao recarregar
        coverCache.clear();
        atualizarFiltrosOptions();
        aplicarFiltros();
    }

    function recarregarCapas() {
        coverCache.clear();
        aplicarFiltros();
    }

    function initEventos() {
        searchInput.addEventListener('input', aplicarFiltros);
        authorFilter.addEventListener('change', aplicarFiltros);
        collectionFilter.addEventListener('change', aplicarFiltros);
        clearBtn.addEventListener('click', function() {
            searchInput.value = '';
            authorFilter.value = '';
            collectionFilter.value = '';
            aplicarFiltros();
        });
        reloadCoversBtn.addEventListener('click', recarregarCapas);
        openStatsBtn.addEventListener('click', function() {
            statsModalBody.innerHTML = gerarEstatisticas();
            modal.classList.add('active');
        });
        closeModalBtn.addEventListener('click', function() {
            modal.classList.remove('active');
        });
        modal.addEventListener('click', function(e) {
            if (e.target === modal) modal.classList.remove('active');
        });
    }

    initEventos();
    carregarDados();
</script>
</body>
</html>
