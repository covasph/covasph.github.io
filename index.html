<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Antioch · Biblioteca Elsa, Vasco e Hugo</title>
    <style>
        /* ========== RESET & BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #eef2f7 0%, #e0e8f0 100%);
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            color: #1a2c3c;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ========== HEADER ========== */
        .header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1f4e6e, #0e3a52, #2c6c8f);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.03);
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 500;
            color: #3e6b8c;
            margin-top: 0.2rem;
            letter-spacing: 0.3px;
            font-style: italic;
        }

        .stats-btn-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.8rem;
        }

        /* Botão estatísticas – ícone com cor azul suave e visível */
        .stats-button {
            background: #2c5a7a;
            border: none;
            padding: 0.7rem 1.8rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #f0f7fc;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(28, 65, 92, 0.2);
        }

        .stats-button i, .stats-button .emoji-icon {
            font-size: 1.1rem;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.1));
            color: #c9e9ff;
        }

        .stats-button:hover {
            background: #1e4a6b;
            transform: scale(1.02);
            box-shadow: 0 8px 18px rgba(28, 65, 92, 0.3);
        }

        .stats-button:hover .emoji-icon {
            color: #ffffff;
        }

        /* ========== BARRA DE PESQUISA ========== */
        .search-section {
            background: #ffffffdd;
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 6px 14px rgba(0, 20, 40, 0.08);
            border: 1px solid #cbdde9;
        }

        .search-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 3;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 1px solid #bdd4e2;
            border-radius: 3rem;
            font-size: 1rem;
            background: #ffffff;
            transition: all 0.2s;
            outline: none;
            color: #1a3b4f;
        }

        .search-box input:focus {
            border-color: #3e8ab3;
            box-shadow: 0 0 0 3px rgba(62, 138, 179, 0.2);
        }

        .filter-group {
            flex: 2;
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .filter-group select {
            flex: 1;
            padding: 0.9rem 1rem;
            border-radius: 3rem;
            border: 1px solid #bdd4e2;
            background: white;
            font-size: 0.9rem;
            color: #1f4b65;
            cursor: pointer;
            font-weight: 500;
        }

        .clear-btn {
            background: #e3edf5;
            border: none;
            padding: 0 1.4rem;
            border-radius: 3rem;
            font-weight: 600;
            color: #2c607e;
            cursor: pointer;
            transition: 0.2s;
        }

        .clear-btn:hover {
            background: #ccdee9;
            color: #14455f;
        }

        .result-count {
            margin: 0.8rem 0 1rem 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #437693;
        }

        /* ========== GRADE DE LIVROS ========== */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.8rem;
        }

        .book-card {
            background: #ffffff;
            border-radius: 1.5rem;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s;
            box-shadow: 0 6px 14px rgba(33, 58, 78, 0.06);
            border: 1px solid #d6e2ec;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 30px -12px rgba(28, 75, 105, 0.2);
            border-color: #adc8dd;
        }

        .card-content {
            padding: 1.4rem 1.4rem 1.2rem;
            flex: 1;
        }

        .book-title {
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 0.5rem;
            color: #1f405b;
        }

        .book-author {
            font-size: 0.9rem;
            font-weight: 600;
            color: #2f6c8a;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .book-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.75rem;
            margin: 0.7rem 0;
            color: #5f7e96;
        }

        .editora-badge, .colecao-tag, .volume-info {
            background: #eaf1f7;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            font-weight: 500;
        }

        .colecao-tag {
            background: #d9e6f0;
            color: #1f5777;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
            margin: 0.8rem 0 0.6rem;
        }

        .tag {
            background: #eef3f8;
            padding: 0.2rem 0.65rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #2c6482;
        }

        .sinopse {
            font-size: 0.8rem;
            color: #2e546e;
            line-height: 1.4;
            margin-top: 0.7rem;
            border-top: 1px dashed #cbdde9;
            padding-top: 0.7rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .isbn {
            font-size: 0.65rem;
            font-family: monospace;
            color: #7b98ae;
            margin-top: 0.5rem;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            background: #f9fdfe;
            border-radius: 2rem;
            color: #5682a0;
            font-weight: 500;
        }

        /* ========== MODAL ESTATÍSTICAS (AZUL SUAVE) ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(18, 45, 65, 0.8);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-container {
            background: #fefefe;
            width: 90%;
            max-width: 780px;
            max-height: 85vh;
            border-radius: 2rem;
            overflow: hidden;
            box-shadow: 0 30px 40px rgba(0, 20, 40, 0.3);
            display: flex;
            flex-direction: column;
            animation: modalFadeIn 0.2s ease-out;
            border: 1px solid #c6deef;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: 1.5rem 1.8rem;
            background: #e5f0f7;
            border-bottom: 1px solid #c9deec;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.6rem;
            color: #1b4f6e;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #4c7b9b;
            transition: 0.1s;
            line-height: 1;
        }

        .close-modal:hover {
            color: #1c5779;
            transform: scale(1.05);
        }

        .modal-body {
            padding: 1.5rem 1.8rem;
            overflow-y: auto;
            flex: 1;
        }

        .stats-section {
            margin-bottom: 2rem;
        }

        .stats-section h3 {
            font-size: 1.3rem;
            border-left: 6px solid #5f9bc2;
            padding-left: 0.8rem;
            margin-bottom: 1rem;
            color: #1e5779;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 0.9rem;
            background: #f6fafd;
            padding: 1rem;
            border-radius: 1.2rem;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #cde0ec;
            padding: 0.5rem 0;
            font-size: 0.9rem;
        }

        .stat-label {
            font-weight: 600;
            color: #2c6282;
        }

        .stat-number {
            font-weight: 700;
            background: #e3eff8;
            padding: 0.1rem 0.7rem;
            border-radius: 30px;
            color: #175072;
        }

        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 0.5rem;
        }

        .tag-stat {
            background: #e6f0f7;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #226282;
        }

        .colecao-stats {
            background: #f1f7fc;
            border-radius: 1rem;
            padding: 0.8rem 1rem;
            color: #1e5b7c;
        }

        hr {
            margin: 1rem 0;
            border-color: #cde0ec;
        }

        /* ========== RESPONSIVO ========== */
        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem;
            }
            .header h1 {
                font-size: 2.2rem;
            }
            .subtitle {
                font-size: 1rem;
            }
            .stats-btn-wrapper {
                justify-content: center;
                margin-top: 1rem;
            }
            .search-wrapper {
                flex-direction: column;
            }
            .filter-group {
                flex-direction: column;
            }
            .books-grid {
                grid-template-columns: 1fr;
                gap: 1.2rem;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.7rem;
            color: #7c9bb3;
            padding: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🏛️ Antioch</h1>
        <div class="subtitle">Biblioteca Elsa, Vasco e Hugo</div>
        <div class="stats-btn-wrapper">
            <button id="openStatsModal" class="stats-button">
                <span class="emoji-icon">📊</span> Estatísticas da Biblioteca
            </button>
        </div>
    </div>

    <div class="search-section">
        <div class="search-wrapper">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Pesquisar por título, autor, sinopse ou tag..." autocomplete="off">
            </div>
            <div class="filter-group">
                <select id="authorFilter">
                    <option value="">Todos os autores</option>
                </select>
                <select id="collectionFilter">
                    <option value="">Todas as coleções</option>
                </select>
                <button id="clearFilters" class="clear-btn">Limpar filtros ✕</button>
            </div>
        </div>
        <div class="result-count" id="resultCount"></div>
    </div>

    <div id="booksContainer" class="books-grid">
        <div class="no-results" style="display: none;">📖 A carregar biblioteca pessoal...</div>
    </div>
    <footer>✨ Antioch · tons azuis, livros e histórias para recordar</footer>
</div>

<!-- Modal Estatísticas -->
<div id="statsModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h2>📊 Estatísticas da Coleção</h2>
            <button class="close-modal" id="closeModalBtn">&times;</button>
        </div>
        <div class="modal-body" id="statsModalBody">
            <div style="text-align: center;">Carregando dados...</div>
        </div>
    </div>
</div>

<script>
    // ========================
    //  Base de dados e funcionamento da biblioteca
    // ========================
    let bibliotecaData = { livros: [] };
    let livrosFiltrados = [];
    
    // Elementos DOM
    const searchInput = document.getElementById('searchInput');
    const authorFilter = document.getElementById('authorFilter');
    const collectionFilter = document.getElementById('collectionFilter');
    const clearBtn = document.getElementById('clearFilters');
    const booksContainer = document.getElementById('booksContainer');
    const resultCountSpan = document.getElementById('resultCount');
    
    // Modal
    const modal = document.getElementById('statsModal');
    const openStatsBtn = document.getElementById('openStatsModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const statsModalBody = document.getElementById('statsModalBody');
    
    // Utilitário nome da coleção
    function getColecaoNome(livro) {
        if (livro.colecao === true && livro.nome_colecao) return livro.nome_colecao;
        return null;
    }
    
    let autoresUnicos = new Set();
    let colecoesUnicas = new Set();
    
    function atualizarFiltrosOptions() {
        autoresUnicos.clear();
        colecoesUnicas.clear();
        bibliotecaData.livros.forEach(livro => {
            if (livro.autor && livro.autor.trim()) autoresUnicos.add(livro.autor);
            const coll = getColecaoNome(livro);
            if (coll) colecoesUnicas.add(coll);
        });
        
        const sortedAutores = Array.from(autoresUnicos).sort((a,b) => a.localeCompare(b));
        authorFilter.innerHTML = '<option value="">Todos os autores</option>';
        sortedAutores.forEach(autor => {
            const option = document.createElement('option');
            option.value = autor;
            option.textContent = autor;
            authorFilter.appendChild(option);
        });
        
        const sortedColecoes = Array.from(colecoesUnicas).sort((a,b) => a.localeCompare(b));
        collectionFilter.innerHTML = '<option value="">Todas as coleções</option>';
        sortedColecoes.forEach(cole => {
            const option = document.createElement('option');
            option.value = cole;
            option.textContent = cole;
            collectionFilter.appendChild(option);
        });
    }
    
    // Filtros combinados
    function aplicarFiltros() {
        const termo = searchInput.value.trim().toLowerCase();
        const autorSelecionado = authorFilter.value;
        const colecaoSelecionada = collectionFilter.value;
        
        livrosFiltrados = bibliotecaData.livros.filter(livro => {
            let matchTexto = true;
            if (termo !== "") {
                const tituloMatch = (livro.titulo || "").toLowerCase().includes(termo);
                const autorMatch = (livro.autor || "").toLowerCase().includes(termo);
                const sinopseMatch = (livro.sinopse || "").toLowerCase().includes(termo);
                let tagsMatch = false;
                if (livro.tags && Array.isArray(livro.tags)) {
                    tagsMatch = livro.tags.some(tag => tag.toLowerCase().includes(termo));
                }
                matchTexto = tituloMatch || autorMatch || sinopseMatch || tagsMatch;
            }
            let matchAutor = (autorSelecionado === "") ? true : (livro.autor === autorSelecionado);
            let matchColecao = true;
            if (colecaoSelecionada !== "") {
                const collNome = getColecaoNome(livro);
                matchColecao = (collNome === colecaoSelecionada);
            }
            return matchTexto && matchAutor && matchColecao;
        });
        
        resultCountSpan.textContent = `📌 ${livrosFiltrados.length} livro(s) encontrado(s) · total ${bibliotecaData.livros.length}`;
        renderizarLivros(livrosFiltrados);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function renderizarLivros(livrosArray) {
        if (!livrosArray.length) {
            booksContainer.innerHTML = `<div class="no-results">📭 Nenhum livro encontrado. Tente outros termos ou limpe os filtros.</div>`;
            return;
        }
        booksContainer.innerHTML = livrosArray.map(livro => {
            const tagsHtml = (livro.tags && livro.tags.length) 
                ? `<div class="tag-list">${livro.tags.map(tag => `<span class="tag">#${escapeHtml(tag)}</span>`).join('')}</div>`
                : '';
            let colecaoHtml = '';
            if (livro.colecao === true && livro.nome_colecao) {
                const volInfo = livro.volume_colecao ? ` · Vol. ${livro.volume_colecao}` : '';
                colecaoHtml = `<div class="colecao-tag">📘 ${escapeHtml(livro.nome_colecao)}${volInfo}</div>`;
            }
            const editoraHtml = livro.editora ? `<span class="editora-badge">🏢 ${escapeHtml(livro.editora)}</span>` : '';
            const isbnHtml = livro.isbn ? `<div class="isbn">📖 ISBN: ${livro.isbn}</div>` : '';
            const sinopseText = livro.sinopse ? livro.sinopse : "Sem sinopse disponível.";
            const shortSinopse = sinopseText.length > 140 ? sinopseText.substring(0, 140) + '…' : sinopseText;
            
            return `
                <div class="book-card">
                    <div class="card-content">
                        <div class="book-title">${escapeHtml(livro.titulo || "Título desconhecido")}</div>
                        <div class="book-author">✍️ ${escapeHtml(livro.autor || "Autor desconhecido")}</div>
                        <div class="book-meta">
                            ${editoraHtml}
                            ${colecaoHtml}
                        </div>
                        ${tagsHtml}
                        <div class="sinopse">📖 ${escapeHtml(shortSinopse)}</div>
                        ${isbnHtml}
                    </div>
                </div>
            `;
        }).join('');
    }
    
    // ========= GERAR ESTATÍSTICAS COMPLETAS =========
    function gerarEstatisticas() {
        const livros = bibliotecaData.livros;
        if (!livros.length) return "<div style='text-align:center'>Nenhum livro carregado na biblioteca.</div>";
        
        const autorCount = new Map();
        const tagCount = new Map();
        const colecaoCount = new Map();
        let totalLivros = livros.length;
        
        livros.forEach(livro => {
            const autor = livro.autor || "Autor desconhecido";
            autorCount.set(autor, (autorCount.get(autor) || 0) + 1);
            if (livro.tags && Array.isArray(livro.tags)) {
                livro.tags.forEach(tag => {
                    const tagLower = tag.toLowerCase();
                    tagCount.set(tagLower, (tagCount.get(tagLower) || 0) + 1);
                });
            }
            const colecao = getColecaoNome(livro);
            if (colecao) colecaoCount.set(colecao, (colecaoCount.get(colecao) || 0) + 1);
        });
        
        const sortedAutores = Array.from(autorCount.entries()).sort((a,b) => b[1] - a[1]);
        const sortedTags = Array.from(tagCount.entries()).sort((a,b) => b[1] - a[1]);
        const sortedColecoes = Array.from(colecaoCount.entries()).sort((a,b) => b[1] - a[1]);
        const livrosSemColecao = livros.filter(l => !getColecaoNome(l)).length;
        const livrosEmColecao = livros.filter(l => l.colecao === true && l.nome_colecao).length;
        
        let html = `
            <div class="stats-section">
                <h3>📚 Resumo Geral</h3>
                <div class="stats-grid" style="grid-template-columns:repeat(auto-fit, minmax(170px,1fr));">
                    <div class="stat-item"><span class="stat-label">Total de livros</span><span class="stat-number">${totalLivros}</span></div>
                    <div class="stat-item"><span class="stat-label">Autores distintos</span><span class="stat-number">${autorCount.size}</span></div>
                    <div class="stat-item"><span class="stat-label">Coleções</span><span class="stat-number">${colecaoCount.size}</span></div>
                    <div class="stat-item"><span class="stat-label">Livros em coleções</span><span class="stat-number">${livrosEmColecao}</span></div>
                    <div class="stat-item"><span class="stat-label">Livros avulsos</span><span class="stat-number">${livrosSemColecao}</span></div>
                </div>
            </div>
            <div class="stats-section">
                <h3>✍️ Livros por autor (top 12)</h3>
                <div class="stats-grid">
                    ${sortedAutores.slice(0,12).map(([autor, qtd]) => `
                        <div class="stat-item"><span class="stat-label">${escapeHtml(autor)}</span><span class="stat-number">${qtd} livro${qtd !== 1 ? 's' : ''}</span></div>
                    `).join('')}
                    ${sortedAutores.length === 0 ? '<div>Nenhum autor registado</div>' : ''}
                </div>
            </div>
            <div class="stats-section">
                <h3>🏷️ Categorias / Tags mais usadas</h3>
                <div class="tag-cloud">
                    ${sortedTags.map(([tag, count]) => `<span class="tag-stat">#${escapeHtml(tag)} (${count})</span>`).join('')}
                    ${sortedTags.length === 0 ? '<span>Sem tags definidas</span>' : ''}
                </div>
            </div>
            <div class="stats-section">
                <h3>📖 Coleções (total de volumes)</h3>
                <div class="stats-grid">
                    ${sortedColecoes.map(([colecao, qtd]) => `
                        <div class="stat-item"><span class="stat-label">📘 ${escapeHtml(colecao)}</span><span class="stat-number">${qtd} vol.</span></div>
                    `).join('')}
                    ${sortedColecoes.length === 0 ? '<div>Nenhuma coleção registada</div>' : ''}
                </div>
            </div>
            <div class="stats-section">
                <h3>🔖 Curiosidades</h3>
                <div class="colecao-stats">
                    <p>⭐ Média de livros por autor: ${(totalLivros / autorCount.size).toFixed(1)}</p>
                    <p>📚 Coleção com mais livros: ${sortedColecoes.length ? `${escapeHtml(sortedColecoes[0][0])} (${sortedColecoes[0][1]} vols)` : '—'}</p>
                    <p>🏷️ Tag predominante: ${sortedTags.length ? `#${escapeHtml(sortedTags[0][0])} (${sortedTags[0][1]} ocorrências)` : '—'}</p>
                </div>
            </div>
        `;
        return html;
    }
    
    function atualizarModalEstatisticas() {
        statsModalBody.innerHTML = gerarEstatisticas();
    }
    
    // Modal handlers
    function openModal() {
        atualizarModalEstatisticas();
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }
    function closeModal() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }
    
    // Carregar ficheiro JSON externo (book_db.json)
    async function carregarDados() {
        try {
            const response = await fetch('book_db.json');
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            if (data && data.livros && Array.isArray(data.livros)) {
                bibliotecaData = data;
            } else {
                bibliotecaData = { livros: [] };
            }
        } catch (error) {
            console.error("Erro ao carregar book_db.json:", error);
            booksContainer.innerHTML = `<div class="no-results">⚠️ Erro ao carregar base de dados. Certifique-se que o ficheiro <strong>book_db.json</strong> está acessível.</div>`;
            bibliotecaData = { livros: [] };
        } finally {
            atualizarFiltrosOptions();
            livrosFiltrados = [...bibliotecaData.livros];
            aplicarFiltros();
        }
    }
    
    function initEventos() {
        searchInput.addEventListener('input', () => aplicarFiltros());
        authorFilter.addEventListener('change', () => aplicarFiltros());
        collectionFilter.addEventListener('change', () => aplicarFiltros());
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            authorFilter.value = '';
            collectionFilter.value = '';
            aplicarFiltros();
        });
        openStatsBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) closeModal();
        });
    }
    
    function init() {
        initEventos();
        carregarDados();
    }
    
    init();
</script>
</body>
</html>
