<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Antioch · Biblioteca Elsa, Vasco e Hugo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #eef2f7 0%, #e0e8f0 100%);
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            color: #1a2c3c;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1f4e6e, #0e3a52, #2c6c8f);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 500;
            color: #3e6b8c;
            margin-top: 0.2rem;
            font-style: italic;
        }

        .stats-btn-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .stats-button, .debug-button {
            background: #2c5a7a;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #f0f7fc;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .debug-button {
            background: #5a6e7a;
        }

        .search-section {
            background: #ffffffdd;
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 6px 14px rgba(0, 20, 40, 0.08);
            border: 1px solid #cbdde9;
        }

        .search-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 3;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 1px solid #bdd4e2;
            border-radius: 3rem;
            font-size: 1rem;
            background: #ffffff;
            outline: none;
        }

        .search-box input:focus {
            border-color: #3e8ab3;
            box-shadow: 0 0 0 3px rgba(62, 138, 179, 0.2);
        }

        .filter-group {
            flex: 2;
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .filter-group select {
            flex: 1;
            padding: 0.9rem 1rem;
            border-radius: 3rem;
            border: 1px solid #bdd4e2;
            background: white;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .clear-btn {
            background: #e3edf5;
            border: none;
            padding: 0 1.4rem;
            border-radius: 3rem;
            font-weight: 600;
            cursor: pointer;
        }

        .result-count {
            margin: 0.8rem 0 1rem 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #437693;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.8rem;
        }

        .book-card {
            background: #ffffff;
            border-radius: 1.5rem;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s;
            box-shadow: 0 6px 14px rgba(33, 58, 78, 0.06);
            border: 1px solid #d6e2ec;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 30px -12px rgba(28, 75, 105, 0.2);
        }

        .card-content {
            padding: 1.4rem 1.4rem 1.2rem;
            flex: 1;
        }

        .book-title {
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 0.5rem;
            color: #1f405b;
        }

        .book-author {
            font-size: 0.9rem;
            font-weight: 600;
            color: #2f6c8a;
            margin-bottom: 0.6rem;
        }

        .book-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.75rem;
            margin: 0.7rem 0;
            color: #5f7e96;
        }

        .editora-badge, .colecao-tag {
            background: #eaf1f7;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
        }

        .colecao-tag {
            background: #d9e6f0;
            color: #1f5777;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
            margin: 0.8rem 0 0.6rem;
        }

        .tag {
            background: #eef3f8;
            padding: 0.2rem 0.65rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #2c6482;
        }

        .sinopse {
            font-size: 0.8rem;
            color: #2e546e;
            line-height: 1.4;
            margin-top: 0.7rem;
            border-top: 1px dashed #cbdde9;
            padding-top: 0.7rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .isbn {
            font-size: 0.65rem;
            font-family: monospace;
            color: #7b98ae;
            margin-top: 0.5rem;
        }

        .no-results, .error-message {
            text-align: center;
            padding: 3rem;
            background: #f9fdfe;
            border-radius: 2rem;
            color: #5682a0;
        }

        .error-message {
            background: #fff0f0;
            color: #c7254e;
            border: 1px solid #f5c6cb;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(18, 45, 65, 0.8);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-container {
            background: #fefefe;
            width: 90%;
            max-width: 780px;
            max-height: 85vh;
            border-radius: 2rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 1.5rem 1.8rem;
            background: #e5f0f7;
            border-bottom: 1px solid #c9deec;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.6rem;
            color: #1b4f6e;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #4c7b9b;
        }

        .modal-body {
            padding: 1.5rem 1.8rem;
            overflow-y: auto;
            flex: 1;
        }

        .stats-section {
            margin-bottom: 2rem;
        }

        .stats-section h3 {
            font-size: 1.3rem;
            border-left: 6px solid #5f9bc2;
            padding-left: 0.8rem;
            margin-bottom: 1rem;
            color: #1e5779;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 0.9rem;
            background: #f6fafd;
            padding: 1rem;
            border-radius: 1.2rem;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px dashed #cde0ec;
        }

        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .tag-stat {
            background: #e6f0f7;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
        }

        @media (max-width: 640px) {
            .stats-btn-wrapper {
                justify-content: center;
            }
            .search-wrapper, .filter-group {
                flex-direction: column;
            }
            .books-grid {
                grid-template-columns: 1fr;
            }
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.7rem;
            color: #7c9bb3;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🏛️ Antioch</h1>
        <div class="subtitle">Biblioteca Elsa, Vasco e Hugo</div>
        <div class="stats-btn-wrapper">
            <button id="openStatsModal" class="stats-button">📊 Estatísticas</button>
            <button id="debugRenderBtn" class="debug-button">🔧 Debug</button>
        </div>
    </div>

    <div class="search-section">
        <div class="search-wrapper">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Pesquisar título, autor, sinopse ou tag..." autocomplete="off">
            </div>
            <div class="filter-group">
                <select id="authorFilter"><option value="">Todos os autores</option></select>
                <select id="collectionFilter"><option value="">Todas as coleções</option></select>
                <button id="clearFilters" class="clear-btn">Limpar ✕</button>
            </div>
        </div>
        <div class="result-count" id="resultCount"></div>
    </div>

    <div id="booksContainer" class="books-grid">
        <div class="no-results">📖 A carregar biblioteca...</div>
    </div>
    <footer>✨ Antioch · livros, palavras e histórias partilhadas</footer>
</div>

<div id="statsModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h2>📊 Estatísticas</h2>
            <button class="close-modal" id="closeModalBtn">&times;</button>
        </div>
        <div class="modal-body" id="statsModalBody">Carregando...</div>
    </div>
</div>

<script>
    let bibliotecaData = { livros: [] };
    let livrosFiltrados = [];

    // Elementos
    const searchInput = document.getElementById('searchInput');
    const authorFilter = document.getElementById('authorFilter');
    const collectionFilter = document.getElementById('collectionFilter');
    const clearBtn = document.getElementById('clearFilters');
    const booksContainer = document.getElementById('booksContainer');
    const resultCountSpan = document.getElementById('resultCount');
    const debugBtn = document.getElementById('debugRenderBtn');
    
    // Modal
    const modal = document.getElementById('statsModal');
    const openStatsBtn = document.getElementById('openStatsModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const statsModalBody = document.getElementById('statsModalBody');

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function getColecaoNome(livro) {
        if (livro.colecao === true && livro.nome_colecao) return livro.nome_colecao;
        return null;
    }

    function atualizarFiltrosOptions() {
        const autores = new Set();
        const colecoes = new Set();
        
        bibliotecaData.livros.forEach(livro => {
            if (livro.autor?.trim()) autores.add(livro.autor);
            const coll = getColecaoNome(livro);
            if (coll) colecoes.add(coll);
        });
        
        authorFilter.innerHTML = '<option value="">Todos os autores</option>';
        Array.from(autores).sort().forEach(autor => {
            authorFilter.innerHTML += `<option value="${escapeHtml(autor)}">${escapeHtml(autor)}</option>`;
        });
        
        collectionFilter.innerHTML = '<option value="">Todas as coleções</option>';
        Array.from(colecoes).sort().forEach(cole => {
            collectionFilter.innerHTML += `<option value="${escapeHtml(cole)}">${escapeHtml(cole)}</option>`;
        });
    }

    // FUNÇÃO DE RENDERIZAÇÃO CORRIGIDA - ROBUSTA
    function renderizarLivros(livrosArray) {
        console.log("🎨 Renderizando", livrosArray.length, "livros");
        
        if (!livrosArray || livrosArray.length === 0) {
            booksContainer.innerHTML = `<div class="no-results">📭 Nenhum livro encontrado.</div>`;
            return;
        }
        
        try {
            let html = '';
            let cardsCriados = 0;
            
            for (let i = 0; i < livrosArray.length; i++) {
                const livro = livrosArray[i];
                
                // Proteção total contra campos nulos
                const titulo = livro.titulo || "Título desconhecido";
                const autor = livro.autor || "Autor desconhecido";
                const editora = livro.editora || "";
                const sinopseText = livro.sinopse || "Sem sinopse disponível.";
                const shortSinopse = sinopseText.length > 140 ? sinopseText.substring(0, 140) + '…' : sinopseText;
                const isbn = livro.isbn || "";
                
                // Tags
                let tagsHtml = '';
                if (livro.tags && Array.isArray(livro.tags) && livro.tags.length > 0) {
                    const tagItems = livro.tags.map(tag => `<span class="tag">#${escapeHtml(tag || '')}</span>`).join('');
                    tagsHtml = `<div class="tag-list">${tagItems}</div>`;
                }
                
                // Coleção
                let colecaoHtml = '';
                if (livro.colecao === true && livro.nome_colecao) {
                    const volInfo = livro.volume_colecao ? ` · Vol. ${livro.volume_colecao}` : '';
                    colecaoHtml = `<div class="colecao-tag">📘 ${escapeHtml(livro.nome_colecao)}${volInfo}</div>`;
                }
                
                // Editora
                const editoraHtml = editora ? `<span class="editora-badge">🏢 ${escapeHtml(editora)}</span>` : '';
                
                html += `
                    <div class="book-card">
                        <div class="card-content">
                            <div class="book-title">${escapeHtml(titulo)}</div>
                            <div class="book-author">✍️ ${escapeHtml(autor)}</div>
                            <div class="book-meta">${editoraHtml} ${colecaoHtml}</div>
                            ${tagsHtml}
                            <div class="sinopse">📖 ${escapeHtml(shortSinopse)}</div>
                            ${isbn ? `<div class="isbn">ISBN: ${escapeHtml(isbn)}</div>` : ''}
                        </div>
                    </div>
                `;
                cardsCriados++;
            }
            
            booksContainer.innerHTML = html;
            console.log("✅ Renderização OK! Cards criados:", cardsCriados);
            
        } catch (error) {
            console.error("❌ ERRO na renderização:", error);
            booksContainer.innerHTML = `<div class="error-message">Erro ao mostrar livros: ${escapeHtml(error.message)}<br><br>Verifique o console (F12) para mais detalhes.</div>`;
        }
    }

    function aplicarFiltros() {
        const termo = searchInput.value.trim().toLowerCase();
        const autorSel = authorFilter.value;
        const colecaoSel = collectionFilter.value;
        
        livrosFiltrados = bibliotecaData.livros.filter(livro => {
            let matchTexto = true;
            if (termo) {
                matchTexto = (livro.titulo || "").toLowerCase().includes(termo) ||
                            (livro.autor || "").toLowerCase().includes(termo) ||
                            (livro.sinopse || "").toLowerCase().includes(termo) ||
                            (livro.tags || []).some(t => (t || "").toLowerCase().includes(termo));
            }
            let matchAutor = !autorSel || livro.autor === autorSel;
            let matchColecao = !colecaoSel || getColecaoNome(livro) === colecaoSel;
            return matchTexto && matchAutor && matchColecao;
        });
        
        resultCountSpan.textContent = `📌 ${livrosFiltrados.length} de ${bibliotecaData.livros.length} livro(s)`;
        renderizarLivros(livrosFiltrados);
    }

    function gerarEstatisticas() {
        const livros = bibliotecaData.livros;
        if (!livros.length) return "<div>Nenhum livro carregado.</div>";
        
        const autorCount = new Map();
        const tagCount = new Map();
        const colecaoCount = new Map();
        
        livros.forEach(livro => {
            const autor = livro.autor || "Desconhecido";
            autorCount.set(autor, (autorCount.get(autor) || 0) + 1);
            (livro.tags || []).forEach(tag => {
                const t = (tag || "").toLowerCase();
                if (t) tagCount.set(t, (tagCount.get(t) || 0) + 1);
            });
            const coll = getColecaoNome(livro);
            if (coll) colecaoCount.set(coll, (colecaoCount.get(coll) || 0) + 1);
        });
        
        const topAutores = Array.from(autorCount.entries()).sort((a,b) => b[1] - a[1]).slice(0, 15);
        const topTags = Array.from(tagCount.entries()).sort((a,b) => b[1] - a[1]).slice(0, 20);
        const topColecoes = Array.from(colecaoCount.entries()).sort((a,b) => b[1] - a[1]);
        
        return `
            <div class="stats-section">
                <h3>📚 Resumo</h3>
                <div class="stats-grid">
                    <div class="stat-item"><strong>Total livros</strong> <span>${livros.length}</span></div>
                    <div class="stat-item"><strong>Autores</strong> <span>${autorCount.size}</span></div>
                    <div class="stat-item"><strong>Coleções</strong> <span>${colecaoCount.size}</span></div>
                </div>
            </div>
            <div class="stats-section">
                <h3>✍️ Top Autores</h3>
                <div class="stats-grid">${topAutores.map(([a,q]) => `<div class="stat-item">${escapeHtml(a)} <span>${q}</span></div>`).join('')}</div>
            </div>
            <div class="stats-section">
                <h3>🏷️ Tags</h3>
                <div class="tag-cloud">${topTags.map(([t,q]) => `<span class="tag-stat">#${escapeHtml(t)} (${q})</span>`).join('')}</div>
            </div>
            <div class="stats-section">
                <h3>📖 Coleções</h3>
                <div class="stats-grid">${topColecoes.map(([c,q]) => `<div class="stat-item">${escapeHtml(c)} <span>${q} vol.</span></div>`).join('')}</div>
            </div>
        `;
    }

    async function carregarDados() {
        booksContainer.innerHTML = `<div class="no-results">📖 A carregar biblioteca com ${bibliotecaData.livros.length || 0} livros...</div>`;
        
        try {
            const response = await fetch('book_db.json?t=' + Date.now());
            if (response.ok) {
                const data = await response.json();
                if (data && data.livros && Array.isArray(data.livros)) {
                    bibliotecaData = data;
                    console.log(`✅ Carregados ${bibliotecaData.livros.length} livros do ficheiro`);
                }
            } else {
                console.warn("Ficheiro não encontrado, usando dados internos");
            }
        } catch (e) {
            console.warn("Erro no fetch:", e.message);
        }
        
        atualizarFiltrosOptions();
        aplicarFiltros();
    }

    function initEventos() {
        searchInput.addEventListener('input', aplicarFiltros);
        authorFilter.addEventListener('change', aplicarFiltros);
        collectionFilter.addEventListener('change', aplicarFiltros);
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            authorFilter.value = '';
            collectionFilter.value = '';
            aplicarFiltros();
        });
        debugBtn.addEventListener('click', () => {
            console.log("=== DEBUG INFO ===");
            console.log("Total livros:", bibliotecaData.livros.length);
            console.log("Primeiro livro:", bibliotecaData.livros[0]);
            console.log("Container existe?", !!booksContainer);
            renderizarLivros(livrosFiltrados);
        });
        openStatsBtn.addEventListener('click', () => {
            statsModalBody.innerHTML = gerarEstatisticas();
            modal.classList.add('active');
        });
        closeModalBtn.addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
    }

    initEventos();
    carregarDados();
</script>
</body>
</html>
