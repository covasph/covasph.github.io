<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Antioch · Biblioteca Elsa, Vasco e Hugo</title>
    <style>
        /* Estilos mantidos iguais ao código anterior - omitido por brevidade */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #eef2f7 0%, #e0e8f0 100%);
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            color: #1a2c3c;
            padding: 2rem 1rem;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 3rem; font-weight: 800; background: linear-gradient(135deg, #1f4e6e, #0e3a52, #2c6c8f); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .subtitle { font-size: 1.2rem; font-weight: 500; color: #3e6b8c; font-style: italic; }
        .stats-btn-wrapper { display: flex; justify-content: flex-end; margin-top: 0.8rem; gap: 0.5rem; }
        .stats-button { background: #2c5a7a; border: none; padding: 0.7rem 1.5rem; border-radius: 60px; font-weight: 600; color: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .search-section { background: #ffffffdd; border-radius: 2rem; padding: 1.2rem 1.5rem; margin-bottom: 2rem; border: 1px solid #cbdde9; }
        .search-wrapper { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; }
        .search-box { flex: 3; min-width: 200px; }
        .search-box input { width: 100%; padding: 0.9rem 1.2rem; border: 1px solid #bdd4e2; border-radius: 3rem; font-size: 1rem; outline: none; }
        .filter-group { flex: 2; display: flex; gap: 0.8rem; flex-wrap: wrap; }
        .filter-group select { flex: 1; padding: 0.9rem 1rem; border-radius: 3rem; border: 1px solid #bdd4e2; background: white; cursor: pointer; }
        .clear-btn { background: #e3edf5; border: none; padding: 0 1.4rem; border-radius: 3rem; font-weight: 600; cursor: pointer; }
        .result-count { margin: 0.8rem 0 1rem 0.5rem; font-size: 0.85rem; color: #437693; }
        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; }
        .book-card { background: #fff; border-radius: 1rem; padding: 1rem; transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border: 1px solid #d6e2ec; cursor: pointer; }
        .book-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(28,75,105,0.15); }
        .book-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.3rem; color: #1f405b; }
        .book-author { font-size: 0.8rem; font-weight: 600; color: #2f6c8a; margin-bottom: 0.5rem; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.5rem; }
        .tag { background: #eef3f8; padding: 0.15rem 0.5rem; border-radius: 15px; font-size: 0.65rem; color: #2c6482; }
        .colecao-badge { display: inline-block; background: #d9e6f0; padding: 0.15rem 0.5rem; border-radius: 15px; font-size: 0.65rem; margin-top: 0.4rem; color: #1f5777; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(18,45,65,0.85); backdrop-filter: blur(8px); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.2s; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-container { background: #fff; width: 90%; max-width: 900px; max-height: 85vh; border-radius: 1.5rem; overflow: hidden; display: flex; flex-direction: column; }
        .modal-header { padding: 1.2rem 1.5rem; background: #e5f0f7; border-bottom: 1px solid #c9deec; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h2 { font-size: 1.3rem; color: #1b4f6e; }
        .close-modal { background: none; border: none; font-size: 1.8rem; cursor: pointer; color: #4c7b9b; padding: 0 0.5rem; }
        .modal-body { padding: 1.5rem; overflow-y: auto; flex: 1; }
        .detail-layout { display: flex; gap: 1.5rem; flex-wrap: wrap; }
        .detail-cover { flex: 0 0 200px; text-align: center; }
        .detail-cover img { width: 100%; max-width: 180px; border-radius: 0.8rem; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .cover-placeholder-detail { width: 180px; height: 260px; background: linear-gradient(135deg, #d4e0e8, #e8f0f5); border-radius: 0.8rem; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #5f8aac; margin: 0 auto; }
        .detail-info { flex: 1; min-width: 250px; }
        .detail-info h3 { font-size: 1.6rem; color: #1f405b; margin-bottom: 0.3rem; }
        .detail-author { font-size: 1rem; color: #2f6c8a; font-weight: 600; margin-bottom: 0.8rem; border-bottom: 1px solid #e0e8f0; padding-bottom: 0.5rem; }
        .detail-field { margin-bottom: 0.8rem; }
        .detail-label { font-weight: 700; color: #1f5779; min-width: 100px; display: inline-block; font-size: 0.85rem; }
        .detail-value { color: #2c4a64; font-size: 0.85rem; }
        .detail-sinopse { margin-top: 1rem; padding-top: 0.8rem; border-top: 1px solid #e0e8f0; }
        .detail-sinopse .detail-value { line-height: 1.5; }
        .detail-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.8rem 0; }
        .detail-tag { background: #eef3f8; padding: 0.2rem 0.7rem; border-radius: 20px; font-size: 0.75rem; }
        .stats-grid, .tag-cloud { background: #f6fafd; padding: 0.8rem; border-radius: 1rem; }
        @media (max-width: 640px) {
            .detail-layout { flex-direction: column; align-items: center; }
            .books-grid { grid-template-columns: 1fr; }
            .search-wrapper, .filter-group { flex-direction: column; }
        }
        footer { text-align: center; margin-top: 2rem; font-size: 0.7rem; color: #7c9bb3; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🏛️ Antioch</h1>
        <div class="subtitle">Biblioteca Elsa, Vasco e Hugo</div>
        <div class="stats-btn-wrapper">
            <button id="openStatsModal" class="stats-button">📊 Estatísticas</button>
        </div>
    </div>

    <div class="search-section">
        <div class="search-wrapper">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Pesquisar título, autor, sinopse ou tag..." autocomplete="off">
            </div>
            <div class="filter-group">
                <select id="authorFilter"><option value="">Todos os autores</option></select>
                <select id="collectionFilter"><option value="">Todas as coleções</option></select>
                <button id="clearFilters" class="clear-btn">Limpar ✕</button>
            </div>
        </div>
        <div class="result-count" id="resultCount"></div>
    </div>

    <div id="booksContainer" class="books-grid">
        <div class="no-results">📖 A carregar biblioteca...</div>
    </div>
    <footer>✨ Clique em qualquer livro para ver detalhes e capa (Google Books + Open Library)</footer>
</div>

<!-- Modais -->
<div id="detailModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h2>Detalhes do Livro</h2>
            <button class="close-modal" id="closeDetailModal">&times;</button>
        </div>
        <div class="modal-body" id="detailModalBody">Carregando...</div>
    </div>
</div>

<div id="statsModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h2>📊 Estatísticas</h2>
            <button class="close-modal" id="closeStatsModal">&times;</button>
        </div>
        <div class="modal-body" id="statsModalBody">Carregando...</div>
    </div>
</div>

<script>
    let bibliotecaData = { livros: [] };
    let livrosFiltrados = [];
    let coverCache = new Map();

    // Elementos
    const searchInput = document.getElementById('searchInput');
    const authorFilter = document.getElementById('authorFilter');
    const collectionFilter = document.getElementById('collectionFilter');
    const clearBtn = document.getElementById('clearFilters');
    const booksContainer = document.getElementById('booksContainer');
    const resultCountSpan = document.getElementById('resultCount');
    
    // Modals
    const detailModal = document.getElementById('detailModal');
    const statsModal = document.getElementById('statsModal');
    const detailModalBody = document.getElementById('detailModalBody');
    const statsModalBody = document.getElementById('statsModalBody');
    const closeDetailModal = document.getElementById('closeDetailModal');
    const closeStatsModal = document.getElementById('closeStatsModal');
    const openStatsBtn = document.getElementById('openStatsModal');

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function getAutorString(autor) {
        if (!autor) return "Autor desconhecido";
        if (typeof autor === 'string') return autor;
        if (Array.isArray(autor)) return autor.join(' e ');
        return String(autor);
    }

    function getAutorArray(autor) {
        if (!autor) return [];
        if (typeof autor === 'string') return [autor];
        if (Array.isArray(autor)) return autor;
        return [String(autor)];
    }

    function getColecaoNome(livro) {
        if (livro.colecao === true && livro.nome_colecao) return livro.nome_colecao;
        return null;
    }

    // ========== FUNÇÃO PARA OBTER CAPA VIA GOOGLE BOOKS API ==========
    async function getCoverFromGoogleBooks(isbn, titulo, autor) {
        const cacheKey = isbn || `${titulo}|${autor}`.toLowerCase();
        if (coverCache.has(cacheKey)) return coverCache.get(cacheKey);
        
        // Construir query - priorizar ISBN se disponível
        let query = '';
        if (isbn && typeof isbn === 'string' && isbn.length >= 10) {
            const cleanIsbn = isbn.replace(/[-\s]/g, '');
            query = `isbn:${cleanIsbn}`;
        } else {
            query = encodeURIComponent(`${titulo} ${getAutorString(autor)}`);
        }
        
        const url = `https://www.googleapis.com/books/v1/volumes?q=${query}&maxResults=1`;
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.items && data.items[0] && data.items[0].volumeInfo.imageLinks) {
                let coverUrl = data.items[0].volumeInfo.imageLinks.thumbnail;
                if (coverUrl) {
                    coverUrl = coverUrl.replace('&edge=curl', '').replace('http://', 'https://');
                    // Converter para tamanho maior (zoom=1)
                    coverUrl = coverUrl.replace('zoom=1', 'zoom=2');
                    coverCache.set(cacheKey, coverUrl);
                    return coverUrl;
                }
            }
            coverCache.set(cacheKey, null);
            return null;
        } catch (error) {
            console.warn(`Erro ao buscar capa: ${error.message}`);
            coverCache.set(cacheKey, null);
            return null;
        }
    }

    // ========== RENDERIZAR CARDS ==========
    function renderizarLivros(livrosArray) {
        if (!livrosArray || livrosArray.length === 0) {
            booksContainer.innerHTML = '<div class="no-results">📭 Nenhum livro encontrado.</div>';
            return;
        }
        
        let html = '';
        for (let i = 0; i < livrosArray.length; i++) {
            const livro = livrosArray[i];
            const titulo = livro.titulo || "Título desconhecido";
            const autorString = getAutorString(livro.autor);
            
            let tagsHtml = '';
            if (livro.tags && Array.isArray(livro.tags) && livro.tags.length > 0) {
                let tagItems = '';
                const maxTags = Math.min(5, livro.tags.length);
                for (let t = 0; t < maxTags; t++) {
                    tagItems += '<span class="tag">#' + escapeHtml(livro.tags[t]) + '</span>';
                }
                if (livro.tags.length > 5) {
                    tagItems += '<span class="tag">+'+ (livro.tags.length - 5) +'</span>';
                }
                tagsHtml = '<div class="tag-list">' + tagItems + '</div>';
            }
            
            let colecaoHtml = '';
            const colecaoNome = getColecaoNome(livro);
            if (colecaoNome) {
                const volInfo = livro.volume_colecao ? ' Vol.' + livro.volume_colecao : '';
                colecaoHtml = '<div class="colecao-badge">📘 ' + escapeHtml(colecaoNome) + volInfo + '</div>';
            }
            
            html += '<div class="book-card" data-index="' + i + '">' +
                        '<div class="book-title">' + escapeHtml(titulo) + '</div>' +
                        '<div class="book-author">✍️ ' + escapeHtml(autorString) + '</div>' +
                        colecaoHtml +
                        tagsHtml +
                    '</div>';
        }
        
        booksContainer.innerHTML = html;
        
        const cards = document.querySelectorAll('.book-card');
        for (let i = 0; i < cards.length; i++) {
            cards[i].addEventListener('click', (function(idx) {
                return function() { mostrarDetalhes(livrosArray[idx]); };
            })(i));
        }
    }

    // ========== MOSTRAR DETALHES COM CAPA ==========
    async function mostrarDetalhes(livro) {
        const titulo = livro.titulo || "Título desconhecido";
        const autorString = getAutorString(livro.autor);
        const editora = livro.editora || "Não informada";
        const ano = livro.ano || "Não informado";
        const paginas = livro.paginas || "Não informado";
        const isbn = livro.isbn || "Não informado";
        const sinopse = livro.sinopse || "Sem sinopse disponível.";
        const colecaoNome = getColecaoNome(livro);
        const volumeColecao = livro.volume_colecao || "";
        
        let tagsHtml = '';
        if (livro.tags && Array.isArray(livro.tags)) {
            for (let t = 0; t < livro.tags.length; t++) {
                tagsHtml += '<span class="detail-tag">#' + escapeHtml(livro.tags[t]) + '</span>';
            }
        }
        
        let html = '<div class="detail-layout">' +
                        '<div class="detail-cover" id="detail-cover-container">' +
                            '<div class="cover-placeholder-detail">📚<br><span style="font-size:12px;">A carregar capa...</span></div>' +
                        '</div>' +
                        '<div class="detail-info">' +
                            '<h3>' + escapeHtml(titulo) + '</h3>' +
                            '<div class="detail-author">✍️ ' + escapeHtml(autorString) + '</div>' +
                            '<div class="detail-field"><span class="detail-label">Editora:</span> <span class="detail-value">' + escapeHtml(editora) + '</span></div>' +
                            (ano !== "Não informado" ? '<div class="detail-field"><span class="detail-label">Ano:</span> <span class="detail-value">' + escapeHtml(ano) + '</span></div>' : '') +
                            (paginas !== "Não informado" ? '<div class="detail-field"><span class="detail-label">Páginas:</span> <span class="detail-value">' + escapeHtml(paginas) + '</span></div>' : '') +
                            (colecaoNome ? '<div class="detail-field"><span class="detail-label">Coleção:</span> <span class="detail-value">📘 ' + escapeHtml(colecaoNome) + (volumeColecao ? ' (Volume ' + volumeColecao + ')' : '') + '</span></div>' : '') +
                            '<div class="detail-field"><span class="detail-label">ISBN:</span> <span class="detail-value">' + escapeHtml(isbn) + '</span></div>';
        
        if (tagsHtml) {
            html += '<div class="detail-field"><span class="detail-label">Tags:</span></div><div class="detail-tags">' + tagsHtml + '</div>';
        }
        
        html += '<div class="detail-sinopse">' +
                    '<div class="detail-label">📖 Sinopse:</div>' +
                    '<div class="detail-value">' + escapeHtml(sinopse).replace(/\n/g, '<br>') + '</div>' +
                '</div></div></div>';
        
        detailModalBody.innerHTML = html;
        detailModal.classList.add('active');
        
        // Carregar capa via Google Books
        const coverUrl = await getCoverFromGoogleBooks(livro.isbn, titulo, autorString);
        const coverContainer = document.getElementById('detail-cover-container');
        if (coverContainer && coverUrl) {
            coverContainer.innerHTML = '<img src="' + coverUrl + '" alt="Capa de ' + escapeHtml(titulo) + '" onerror="this.parentElement.innerHTML=\'<div class=\\\'cover-placeholder-detail\\\'>📚<br><span style=\\\'font-size:12px;\\\'>Capa não disponível</span></div>\'">';
        } else if (coverContainer) {
            coverContainer.innerHTML = '<div class="cover-placeholder-detail">📚<br><span style="font-size:12px;">Capa não disponível</span></div>';
        }
    }

    // ========== FILTROS ==========
    function aplicarFiltros() {
        const termo = searchInput.value.trim().toLowerCase();
        const autorSel = authorFilter.value;
        const colecaoSel = collectionFilter.value;
        
        const filtrados = [];
        for (let i = 0; i < bibliotecaData.livros.length; i++) {
            const livro = bibliotecaData.livros[i];
            
            let matchTexto = true;
            if (termo !== "") {
                const tituloMatch = (livro.titulo || "").toLowerCase().indexOf(termo) !== -1;
                const autoresLivro = getAutorArray(livro.autor);
                let autorMatch = false;
                for (let a = 0; a < autoresLivro.length; a++) {
                    if ((autoresLivro[a] || "").toLowerCase().indexOf(termo) !== -1) {
                        autorMatch = true;
                        break;
                    }
                }
                const sinopseMatch = (livro.sinopse || "").toLowerCase().indexOf(termo) !== -1;
                let tagsMatch = false;
                if (livro.tags && Array.isArray(livro.tags)) {
                    for (let t = 0; t < livro.tags.length; t++) {
                        if ((livro.tags[t] || "").toLowerCase().indexOf(termo) !== -1) {
                            tagsMatch = true;
                            break;
                        }
                    }
                }
                matchTexto = tituloMatch || autorMatch || sinopseMatch || tagsMatch;
            }
            
            let matchAutor = true;
            if (autorSel !== "") {
                const autoresLivro = getAutorArray(livro.autor);
                matchAutor = false;
                for (let a = 0; a < autoresLivro.length; a++) {
                    if (autoresLivro[a] === autorSel) {
                        matchAutor = true;
                        break;
                    }
                }
            }
            
            let matchColecao = true;
            if (colecaoSel !== "") {
                const collNome = getColecaoNome(livro);
                matchColecao = (collNome === colecaoSel);
            }
            
            if (matchTexto && matchAutor && matchColecao) {
                filtrados.push(livro);
            }
        }
        
        livrosFiltrados = filtrados;
        resultCountSpan.textContent = "📌 " + livrosFiltrados.length + " de " + bibliotecaData.livros.length + " livro(s)";
        renderizarLivros(livrosFiltrados);
    }

    function atualizarFiltrosOptions() {
        const autores = new Set();
        const colecoes = new Set();
        
        for (let i = 0; i < bibliotecaData.livros.length; i++) {
            const livro = bibliotecaData.livros[i];
            const autoresLivro = getAutorArray(livro.autor);
            for (let a = 0; a < autoresLivro.length; a++) {
                const nomeAutor = autoresLivro[a];
                if (nomeAutor && typeof nomeAutor === 'string' && nomeAutor.trim() !== '') {
                    autores.add(nomeAutor.trim());
                }
            }
            const coll = getColecaoNome(livro);
            if (coll) colecoes.add(coll);
        }
        
        authorFilter.innerHTML = '<option value="">Todos os autores</option>';
        const autoresArray = Array.from(autores).sort();
        for (let i = 0; i < autoresArray.length; i++) {
            authorFilter.innerHTML += '<option value="' + escapeHtml(autoresArray[i]) + '">' + escapeHtml(autoresArray[i]) + '</option>';
        }
        
        collectionFilter.innerHTML = '<option value="">Todas as coleções</option>';
        const colecoesArray = Array.from(colecoes).sort();
        for (let i = 0; i < colecoesArray.length; i++) {
            collectionFilter.innerHTML += '<option value="' + escapeHtml(colecoesArray[i]) + '">' + escapeHtml(colecoesArray[i]) + '</option>';
        }
    }

    function gerarEstatisticas() {
        const livros = bibliotecaData.livros;
        if (!livros.length) return "<div>Nenhum livro carregado.</div>";
        
        const autorCount = new Map();
        const tagCount = new Map();
        const colecaoCount = new Map();
        
        for (let i = 0; i < livros.length; i++) {
            const livro = livros[i];
            const autoresLivro = getAutorArray(livro.autor);
            for (let a = 0; a < autoresLivro.length; a++) {
                const autor = autoresLivro[a] || "Desconhecido";
                autorCount.set(autor, (autorCount.get(autor) || 0) + 1);
            }
            if (livro.tags && Array.isArray(livro.tags)) {
                for (let t = 0; t < livro.tags.length; t++) {
                    const tag = (livro.tags[t] || "").toLowerCase();
                    if (tag) tagCount.set(tag, (tagCount.get(tag) || 0) + 1);
                }
            }
            const coll = getColecaoNome(livro);
            if (coll) colecaoCount.set(coll, (colecaoCount.get(coll) || 0) + 1);
        }
        
        const topAutores = Array.from(autorCount.entries()).sort((a,b) => b[1] - a[1]).slice(0, 15);
        const topTags = Array.from(tagCount.entries()).sort((a,b) => b[1] - a[1]).slice(0, 15);
        const topColecoes = Array.from(colecaoCount.entries()).sort((a,b) => b[1] - a[1]);
        
        let html = '<div class="stats-section"><h3>📚 Resumo</h3><div class="stats-grid">' +
                    '<div class="stat-item"><strong>Total livros</strong> <span>' + livros.length + '</span></div>' +
                    '<div class="stat-item"><strong>Autores</strong> <span>' + autorCount.size + '</span></div>' +
                    '<div class="stat-item"><strong>Coleções</strong> <span>' + colecaoCount.size + '</span></div>' +
                    '</div></div>' +
                    '<div class="stats-section"><h3>✍️ Top Autores</h3><div class="stats-grid">';
        for (let i = 0; i < topAutores.length; i++) {
            html += '<div class="stat-item">' + escapeHtml(topAutores[i][0]) + ' <span>' + topAutores[i][1] + '</span></div>';
        }
        html += '</div></div><div class="stats-section"><h3>🏷️ Tags</h3><div class="tag-cloud">';
        for (let i = 0; i < topTags.length; i++) {
            html += '<span class="tag-stat">#' + escapeHtml(topTags[i][0]) + ' (' + topTags[i][1] + ')</span>';
        }
        html += '</div></div><div class="stats-section"><h3>📖 Coleções</h3><div class="stats-grid">';
        for (let i = 0; i < topColecoes.length; i++) {
            html += '<div class="stat-item">' + escapeHtml(topColecoes[i][0]) + ' <span>' + topColecoes[i][1] + ' vol.</span></div>';
        }
        html += '</div></div>';
        return html;
    }

    async function carregarDados() {
        booksContainer.innerHTML = '<div class="no-results">📖 A carregar biblioteca...</div>';
        
        try {
            const response = await fetch('book_db.json?t=' + Date.now());
            if (response.ok) {
                const data = await response.json();
                if (data && data.livros && Array.isArray(data.livros)) {
                    bibliotecaData = data;
                    console.log("✅ Carregados " + bibliotecaData.livros.length + " livros");
                    let comIsbn = bibliotecaData.livros.filter(l => l.isbn).length;
                    console.log("📚 Livros com ISBN: " + comIsbn);
                }
            } else {
                console.warn("Ficheiro não encontrado");
            }
        } catch (e) {
            console.warn("Erro no fetch:", e.message);
        }
        
        if (bibliotecaData.livros.length === 0) {
            booksContainer.innerHTML = '<div class="error-message">⚠️ Não foi possível carregar os livros.</div>';
            return;
        }
        
        atualizarFiltrosOptions();
        aplicarFiltros();
    }

    function initEventos() {
        searchInput.addEventListener('input', aplicarFiltros);
        authorFilter.addEventListener('change', aplicarFiltros);
        collectionFilter.addEventListener('change', aplicarFiltros);
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            authorFilter.value = '';
            collectionFilter.value = '';
            aplicarFiltros();
        });
        openStatsBtn.addEventListener('click', () => {
            statsModalBody.innerHTML = gerarEstatisticas();
            statsModal.classList.add('active');
        });
        closeDetailModal.addEventListener('click', () => detailModal.classList.remove('active'));
        closeStatsModal.addEventListener('click', () => statsModal.classList.remove('active'));
        detailModal.addEventListener('click', (e) => { if (e.target === detailModal) detailModal.classList.remove('active'); });
        statsModal.addEventListener('click', (e) => { if (e.target === statsModal) statsModal.classList.remove('active'); });
    }

    initEventos();
    carregarDados();
</script>
</body>
</html>
