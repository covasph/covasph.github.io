<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Antioch · Biblioteca Elsa, Vasco e Hugo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f5f0e7 0%, #e8dfd3 100%);
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            color: #2c241a;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Cabeçalho com novo título e botão de estatísticas */
        .header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #3e2a1f, #1f1a14, #6b4c2c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.05);
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 500;
            color: #7a6242;
            margin-top: 0.2rem;
            letter-spacing: 0.5px;
            font-style: italic;
        }

        .stats-btn-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.8rem;
        }

        .stats-button {
            background: #2f2a24;
            border: none;
            padding: 0.7rem 1.8rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #fef3e4;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 5px 12px rgba(0,0,0,0.1);
            backdrop-filter: blur(2px);
        }

        .stats-button:hover {
            background: #4e3924;
            transform: scale(1.02);
            box-shadow: 0 8px 18px rgba(0,0,0,0.15);
        }

        .stats-button i {
            font-size: 1.1rem;
        }

        /* Modal de estatísticas */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.75);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-container {
            background: #fffcf5;
            width: 90%;
            max-width: 750px;
            max-height: 85vh;
            border-radius: 2rem;
            overflow: hidden;
            box-shadow: 0 30px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            animation: modalFadeIn 0.2s ease-out;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: 1.5rem 1.8rem;
            background: #e7ddd0;
            border-bottom: 1px solid #dacdbb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.6rem;
            color: #2f241b;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #6c513a;
            transition: 0.1s;
            line-height: 1;
        }

        .close-modal:hover {
            color: #2c1c0e;
            transform: scale(1.05);
        }

        .modal-body {
            padding: 1.5rem 1.8rem;
            overflow-y: auto;
            flex: 1;
        }

        .stats-section {
            margin-bottom: 2rem;
        }

        .stats-section h3 {
            font-size: 1.3rem;
            border-left: 6px solid #b9875c;
            padding-left: 0.8rem;
            margin-bottom: 1rem;
            color: #4a3624;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.9rem;
            background: #fef9f2;
            padding: 1rem;
            border-radius: 1.2rem;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #e2d4c4;
            padding: 0.5rem 0;
            font-size: 0.9rem;
        }

        .stat-label {
            font-weight: 600;
            color: #694e33;
        }

        .stat-number {
            font-weight: 700;
            background: #ede0d1;
            padding: 0.1rem 0.7rem;
            border-radius: 30px;
            color: #38271a;
        }

        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 0.5rem;
        }

        .tag-stat {
            background: #e9ddcf;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .colecao-stats, .total-resumo {
            background: #f7f0e6;
            border-radius: 1rem;
            padding: 0.8rem;
        }

        hr {
            margin: 1rem 0;
            border-color: #ebdfd1;
        }

        /* Barra de pesquisa + filtros */
        .search-section {
            background: #fffdf9;
            border-radius: 2rem;
            padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #f0e3d4;
        }

        .search-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 3;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 1px solid #e2cfb5;
            border-radius: 3rem;
            font-size: 1rem;
            background: white;
            transition: all 0.2s;
            outline: none;
        }

        .search-box input:focus {
            border-color: #b98f64;
            box-shadow: 0 0 0 3px rgba(185, 143, 100, 0.2);
        }

        .filter-group {
            flex: 2;
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .filter-group select {
            flex: 1;
            padding: 0.9rem 1rem;
            border-radius: 3rem;
            border: 1px solid #e2cfb5;
            background: white;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .clear-btn {
            background: #ede3d7;
            border: none;
            padding: 0 1.4rem;
            border-radius: 3rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .clear-btn:hover {
            background: #ddcfbf;
        }

        .result-count {
            margin: 0.8rem 0 1rem 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #7c6246;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.8rem;
        }

        .book-card {
            background: #ffffff;
            border-radius: 1.5rem;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.04);
            border: 1px solid #f0e2d2;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.15);
        }

        .card-content {
            padding: 1.4rem 1.4rem 1.2rem;
            flex: 1;
        }

        .book-title {
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 0.5rem;
            color: #2c241a;
        }

        .book-author {
            font-size: 0.9rem;
            font-weight: 600;
            color: #b1624b;
            margin-bottom: 0.6rem;
        }

        .book-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.75rem;
            margin: 0.7rem 0;
            color: #6b5a48;
        }

        .editora-badge, .colecao-tag, .volume-info {
            background: #f3eee8;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
        }

        .colecao-tag {
            background: #e3d9cf;
            font-weight: 500;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
            margin: 0.8rem 0 0.6rem;
        }

        .tag {
            background: #f1e7de;
            padding: 0.2rem 0.65rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .sinopse {
            font-size: 0.8rem;
            color: #4e3e2c;
            line-height: 1.4;
            margin-top: 0.7rem;
            border-top: 1px dashed #ecdbba;
            padding-top: 0.7rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .isbn {
            font-size: 0.65rem;
            font-family: monospace;
            color: #9a8a76;
            margin-top: 0.5rem;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            background: #fffcf7;
            border-radius: 2rem;
            color: #8e775c;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.8rem;
            }
            .header h1 {
                font-size: 2.2rem;
            }
            .subtitle {
                font-size: 1rem;
            }
            .stats-btn-wrapper {
                justify-content: center;
                margin-top: 1rem;
            }
            .search-wrapper {
                flex-direction: column;
            }
            .filter-group {
                flex-direction: column;
            }
            .books-grid {
                grid-template-columns: 1fr;
            }
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.7rem;
            color: #b7a488;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🏛️ Antioch</h1>
        <div class="subtitle">Biblioteca Elsa, Vasco e Hugo</div>
        <div class="stats-btn-wrapper">
            <button id="openStatsModal" class="stats-button">📊 Estatísticas da Biblioteca</button>
        </div>
    </div>

    <div class="search-section">
        <div class="search-wrapper">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Pesquisar por título, autor, sinopse ou tag..." autocomplete="off">
            </div>
            <div class="filter-group">
                <select id="authorFilter">
                    <option value="">Todos os autores</option>
                </select>
                <select id="collectionFilter">
                    <option value="">Todas as coleções</option>
                </select>
                <button id="clearFilters" class="clear-btn">Limpar filtros ✕</button>
            </div>
        </div>
        <div class="result-count" id="resultCount"></div>
    </div>

    <div id="booksContainer" class="books-grid">
        <div class="no-results" style="display: none;">📖 A carregar a biblioteca...</div>
    </div>
    <footer>✨ Antioch · livros, palavras e histórias partilhadas</footer>
</div>

<!-- Modal de estatísticas -->
<div id="statsModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h2>📊 Estatísticas da Coleção</h2>
            <button class="close-modal" id="closeModalBtn">&times;</button>
        </div>
        <div class="modal-body" id="statsModalBody">
            <div style="text-align: center;">Carregando dados...</div>
        </div>
    </div>
</div>

<script>
    // ========================
    // Base de dados
    // ========================
    let bibliotecaData = { livros: [] };
    let livrosFiltrados = [];
    
    // DOM elements
    const searchInput = document.getElementById('searchInput');
    const authorFilter = document.getElementById('authorFilter');
    const collectionFilter = document.getElementById('collectionFilter');
    const clearBtn = document.getElementById('clearFilters');
    const booksContainer = document.getElementById('booksContainer');
    const resultCountSpan = document.getElementById('resultCount');
    
    // Modal
    const modal = document.getElementById('statsModal');
    const openStatsBtn = document.getElementById('openStatsModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const statsModalBody = document.getElementById('statsModalBody');
    
    // Auxiliares
    function getColecaoNome(livro) {
        if (livro.colecao === true && livro.nome_colecao) return livro.nome_colecao;
        return null;
    }
    
    // Atualizar selects e estatísticas iniciais
    let autoresUnicos = new Set();
    let colecoesUnicas = new Set();
    
    function atualizarFiltrosOptions() {
        autoresUnicos.clear();
        colecoesUnicas.clear();
        bibliotecaData.livros.forEach(livro => {
            if (livro.autor && livro.autor.trim()) autoresUnicos.add(livro.autor);
            const coll = getColecaoNome(livro);
            if (coll) colecoesUnicas.add(coll);
        });
        
        const sortedAutores = Array.from(autoresUnicos).sort((a,b) => a.localeCompare(b));
        authorFilter.innerHTML = '<option value="">Todos os autores</option>';
        sortedAutores.forEach(autor => {
            const option = document.createElement('option');
            option.value = autor;
            option.textContent = autor;
            authorFilter.appendChild(option);
        });
        
        const sortedColecoes = Array.from(colecoesUnicas).sort((a,b) => a.localeCompare(b));
        collectionFilter.innerHTML = '<option value="">Todas as coleções</option>';
        sortedColecoes.forEach(cole => {
            const option = document.createElement('option');
            option.value = cole;
            option.textContent = cole;
            collectionFilter.appendChild(option);
        });
    }
    
    // Filtros
    function aplicarFiltros() {
        const termo = searchInput.value.trim().toLowerCase();
        const autorSelecionado = authorFilter.value;
        const colecaoSelecionada = collectionFilter.value;
        
        livrosFiltrados = bibliotecaData.livros.filter(livro => {
            let matchTexto = true;
            if (termo !== "") {
                const tituloMatch = (livro.titulo || "").toLowerCase().includes(termo);
                const autorMatch = (livro.autor || "").toLowerCase().includes(termo);
                const sinopseMatch = (livro.sinopse || "").toLowerCase().includes(termo);
                let tagsMatch = false;
                if (livro.tags && Array.isArray(livro.tags)) {
                    tagsMatch = livro.tags.some(tag => tag.toLowerCase().includes(termo));
                }
                matchTexto = tituloMatch || autorMatch || sinopseMatch || tagsMatch;
            }
            let matchAutor = (autorSelecionado === "") ? true : (livro.autor === autorSelecionado);
            let matchColecao = true;
            if (colecaoSelecionada !== "") {
                const collNome = getColecaoNome(livro);
                matchColecao = (collNome === colecaoSelecionada);
            }
            return matchTexto && matchAutor && matchColecao;
        });
        
        resultCountSpan.textContent = `📌 ${livrosFiltrados.length} livro(s) encontrado(s) · total ${bibliotecaData.livros.length}`;
        renderizarLivros(livrosFiltrados);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function renderizarLivros(livrosArray) {
        if (!livrosArray.length) {
            booksContainer.innerHTML = `<div class="no-results">📭 Nenhum livro encontrado. Tente outros termos ou limpe os filtros.</div>`;
            return;
        }
        booksContainer.innerHTML = livrosArray.map(livro => {
            const tagsHtml = (livro.tags && livro.tags.length) 
                ? `<div class="tag-list">${livro.tags.map(tag => `<span class="tag">#${escapeHtml(tag)}</span>`).join('')}</div>`
                : '';
            let colecaoHtml = '';
            if (livro.colecao === true && livro.nome_colecao) {
                const volInfo = livro.volume_colecao ? ` · Vol. ${livro.volume_colecao}` : '';
                colecaoHtml = `<div class="colecao-tag">📘 ${escapeHtml(livro.nome_colecao)}${volInfo}</div>`;
            }
            const editoraHtml = livro.editora ? `<span class="editora-badge">🏢 ${escapeHtml(livro.editora)}</span>` : '';
            const isbnHtml = livro.isbn ? `<div class="isbn">📖 ISBN: ${livro.isbn}</div>` : '';
            const sinopseText = livro.sinopse ? livro.sinopse : "Sem sinopse disponível.";
            const shortSinopse = sinopseText.length > 140 ? sinopseText.substring(0, 140) + '…' : sinopseText;
            
            return `
                <div class="book-card">
                    <div class="card-content">
                        <div class="book-title">${escapeHtml(livro.titulo || "Título desconhecido")}</div>
                        <div class="book-author">✍️ ${escapeHtml(livro.autor || "Autor desconhecido")}</div>
                        <div class="book-meta">
                            ${editoraHtml}
                            ${colecaoHtml}
                        </div>
                        ${tagsHtml}
                        <div class="sinopse">📖 ${escapeHtml(shortSinopse)}</div>
                        ${isbnHtml}
                    </div>
                </div>
            `;
        }).join('');
    }
    
    // ============= FUNÇÃO DE ESTATÍSTICAS AVANÇADA =============
    function gerarEstatisticas() {
        const livros = bibliotecaData.livros;
        if (!livros.length) return "<div style='text-align:center'>Nenhum livro na base</div>";
        
        // Contagem por autor
        const autorCount = new Map();
        // Contagem por categoria (tags)
        const tagCount = new Map();
        // Contagem por coleção
        const colecaoCount = new Map();
        let totalLivros = livros.length;
        
        livros.forEach(livro => {
            const autor = livro.autor || "Autor desconhecido";
            autorCount.set(autor, (autorCount.get(autor) || 0) + 1);
            
            if (livro.tags && Array.isArray(livro.tags)) {
                livro.tags.forEach(tag => {
                    const tagLower = tag.toLowerCase();
                    tagCount.set(tagLower, (tagCount.get(tagLower) || 0) + 1);
                });
            }
            const colecao = getColecaoNome(livro);
            if (colecao) {
                colecaoCount.set(colecao, (colecaoCount.get(colecao) || 0) + 1);
            }
        });
        
        // Ordenar autores por mais livros
        const sortedAutores = Array.from(autorCount.entries()).sort((a,b) => b[1] - a[1]);
        const sortedTags = Array.from(tagCount.entries()).sort((a,b) => b[1] - a[1]);
        const sortedColecoes = Array.from(colecaoCount.entries()).sort((a,b) => b[1] - a[1]);
        
        // Livros sem coleção
        const livrosSemColecao = livros.filter(l => !getColecaoNome(l)).length;
        
        // Estatísticas de volumes: total de livros pertencentes a coleções
        const livrosEmColecao = livros.filter(l => l.colecao === true && l.nome_colecao).length;
        
        // Montar HTML
        let html = `
            <div class="stats-section">
                <h3>📚 Resumo Geral</h3>
                <div class="stats-grid" style="grid-template-columns:repeat(auto-fit, minmax(170px,1fr));">
                    <div class="stat-item"><span class="stat-label">Total de livros</span><span class="stat-number">${totalLivros}</span></div>
                    <div class="stat-item"><span class="stat-label">Autores distintos</span><span class="stat-number">${autorCount.size}</span></div>
                    <div class="stat-item"><span class="stat-label">Coleções</span><span class="stat-number">${colecaoCount.size}</span></div>
                    <div class="stat-item"><span class="stat-label">Livros em coleções</span><span class="stat-number">${livrosEmColecao}</span></div>
                    <div class="stat-item"><span class="stat-label">Livros avulsos</span><span class="stat-number">${livrosSemColecao}</span></div>
                </div>
            </div>
            
            <div class="stats-section">
                <h3>✍️ Livros por autor (top 10)</h3>
                <div class="stats-grid">
                    ${sortedAutores.slice(0,12).map(([autor, qtd]) => `
                        <div class="stat-item"><span class="stat-label">${escapeHtml(autor)}</span><span class="stat-number">${qtd} livro${qtd !== 1 ? 's' : ''}</span></div>
                    `).join('')}
                    ${sortedAutores.length === 0 ? '<div>Nenhum autor registado</div>' : ''}
                </div>
            </div>
            
            <div class="stats-section">
                <h3>🏷️ Categorias / Tags mais usadas</h3>
                <div class="tag-cloud">
                    ${sortedTags.map(([tag, count]) => `<span class="tag-stat">#${escapeHtml(tag)} (${count})</span>`).join('')}
                    ${sortedTags.length === 0 ? '<span>Sem tags definidas</span>' : ''}
                </div>
            </div>
            
            <div class="stats-section">
                <h3>📖 Coleções (total de volumes)</h3>
                <div class="stats-grid">
                    ${sortedColecoes.map(([colecao, qtd]) => `
                        <div class="stat-item"><span class="stat-label">📘 ${escapeHtml(colecao)}</span><span class="stat-number">${qtd} vol.</span></div>
                    `).join('')}
                    ${sortedColecoes.length === 0 ? '<div>Nenhuma coleção registada</div>' : ''}
                </div>
            </div>
            
            <div class="stats-section">
                <h3>🔖 Curiosidades</h3>
                <div class="colecao-stats">
                    <p>⭐ Média de livros por autor: ${(totalLivros / autorCount.size).toFixed(1)}</p>
                    <p>📚 Coleção com mais livros: ${sortedColecoes.length ? `${escapeHtml(sortedColecoes[0][0])} (${sortedColecoes[0][1]} vols)` : '—'}</p>
                    <p>🏷️ Tag predominante: ${sortedTags.length ? `#${escapeHtml(sortedTags[0][0])} (${sortedTags[0][1]} ocorrências)` : '—'}</p>
                </div>
            </div>
        `;
        return html;
    }
    
    function atualizarModalEstatisticas() {
        statsModalBody.innerHTML = gerarEstatisticas();
    }
    
    // Modal controls
    function openModal() {
        atualizarModalEstatisticas();
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }
    
    function closeModal() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }
    
    // Carregar dados do JSON
    async function carregarDados() {
        try {
            const response = await fetch('book_db.json');
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            if (data && data.livros && Array.isArray(data.livros)) {
                bibliotecaData = data;
            } else {
                bibliotecaData = { livros: [] };
            }
        } catch (error) {
            console.error("Erro ao carregar book_db.json:", error);
            booksContainer.innerHTML = `<div class="no-results">⚠️ Erro ao carregar base de dados. Verifique se o ficheiro <strong>book_db.json</strong> está acessível.</div>`;
            bibliotecaData = { livros: [] };
        } finally {
            atualizarFiltrosOptions();
            livrosFiltrados = [...bibliotecaData.livros];
            aplicarFiltros();
        }
    }
    
    function initEventos() {
        searchInput.addEventListener('input', () => aplicarFiltros());
        authorFilter.addEventListener('change', () => aplicarFiltros());
        collectionFilter.addEventListener('change', () => aplicarFiltros());
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            authorFilter.value = '';
            collectionFilter.value = '';
            aplicarFiltros();
        });
        openStatsBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) closeModal();
        });
    }
    
    function init() {
        initEventos();
        carregarDados();
    }
    
    init();
</script>
</body>
</html>
